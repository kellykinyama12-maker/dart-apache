name: dart_apache
description: A sample command-line application.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.4

# Add regular dependencies here.
dependencies:
  path: ^1.9.0
  # AES-GCM for opaque, short-lived WebTransport session tickets.
  pointycastle: ^4.0.0
  # HTTP/3 (QUIC) stack, vendored locally so it can be edited/hardened.
  # Pure-Dart port of Cloudflare's quiche; see docs/04-protocols.md.
  dart_quiche:
    path: third_party/dart_quiche

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # Only for example/shelf_adapter.dart — the optional Shelf bridge. The core
  # package never depends on shelf; it stays an opt-in integration.
  shelf: ^1.4.0
  shelf_router: ^1.1.0
